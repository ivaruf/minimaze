<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d140d" />
    <meta
      name="description"
      content="A wooden tilt maze. Tilt the board, roll the marble past the holes and into the cup."
    />
    <title>MiniMaze</title>
    <!-- The arcade builds this game's cabinet from the manifest, splitting
         `name` on the em-dash; the install prompt reads it too. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- Classic and first: it must survive anything the module graph does. -->
    <script src="js/touch-guard.js"></script>
  </head>
  <body>
    <canvas id="view" aria-label="The maze board"></canvas>

    <div id="ui">
      <div id="hud" hidden>
        <span id="level-name" class="plate"></span>
        <!-- The menu plate: three bars, not a gear, because it holds the way
             back into the maze as well as the settings (hub §2). The glyph is
             the hub's exact path. Sound and fullscreen join it in M2. -->
        <button id="menu-btn" class="icon-button" type="button" aria-label="Menu" title="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
      </div>
      <p id="hint" aria-live="polite"></p>

      <!-- Getting into a maze is always a tap, which is also the tap iOS
           needs before it will share the tilt sensor (input/tilt.js). -->
      <section id="start" class="card" hidden>
        <h1>MiniMaze</h1>
        <p class="tag">Tilt the board. Mind the holes.</p>
        <div class="actions">
          <button id="start-go" class="go" type="button">Roll!</button>
          <button id="start-pick" class="go alt" type="button">Pick a maze</button>
        </div>
        <!--
          UPDATE READY. Hidden until a new service worker has installed and
          is waiting; tapping it is the only thing in the game that posts
          SKIP_WAITING. It sits on the title card on purpose — this card is
          gone for the whole of a maze, so no deploy can ever reload a marble
          out from under the player. Owned end to end by js/update.js, which
          nothing imports.
        -->
        <button id="update" type="button" hidden>
          <span class="update-title">A new board is ready</span>
          <span class="update-sub">Tap to take it</span>
        </button>
        <p id="build" hidden></p>
      </section>

      <section id="picker" class="card wide" hidden>
        <h2>Pick a maze</h2>
        <div id="picker-tiles" class="tiles"></div>
        <div class="actions">
          <button id="picker-back" class="go alt" type="button">Back</button>
        </div>
      </section>

      <section id="pause" class="card" hidden>
        <h2>Paused</h2>
        <p class="tag">The marble waits where you left it.</p>
        <div class="actions">
          <button id="pause-resume" class="go" type="button">Keep rolling</button>
          <button id="pause-level" class="go alt" type="button" hidden>Level the board</button>
          <button id="pause-restart" class="go alt" type="button">Start this maze over</button>
          <button id="pause-pick" class="go alt" type="button">Pick a maze</button>
        </div>
      </section>

      <section id="clear" class="card" hidden>
        <h2>Home!</h2>
        <p class="tag">Rolled in <span id="clear-time"></span></p>
        <p id="clear-best" class="best" hidden></p>
        <div class="actions">
          <button id="clear-next" class="go" type="button">Next maze</button>
          <button id="clear-pick" class="go alt" type="button">Pick a maze</button>
        </div>
      </section>

      <section id="no-gl" class="card" hidden>
        <h2>No 3D here</h2>
        <p class="tag">
          This browser will not draw the board (WebGL is off or missing). Try
          another browser, or turn hardware acceleration back on.
        </p>
      </section>
    </div>

    <!--
      Crash bar. A module script reports its whole import graph through the
      one <script> tag, so a failure here names js/main.js even when the file
      that actually failed to load was one of its imports, three.js included
      — say so in the message, or the next reader goes and checks a file that
      is serving 200s.
    -->
    <div id="crash" role="alert" hidden></div>
    <script>
      (function () {
        var bar = document.getElementById("crash");
        function show(msg) {
          bar.textContent = msg;
          bar.hidden = false;
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "SCRIPT" && t.dataset && t.dataset.handled)
              return;
            if (t && t.tagName === "SCRIPT") {
              show(
                "A script failed to load: " +
                  t.src +
                  " (if this is js/main.js, the real culprit may be one of its imports)",
              );
              return;
            }
            show("Something broke: " + (e.message || e.type));
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          show(
            "Something broke: " +
              (e.reason && e.reason.message ? e.reason.message : e.reason),
          );
        });
      })();
    </script>
    <!--
      The service worker and the update button, in a graph of their own and
      ahead of the game's: a module graph aborts as a whole when one import
      fails, and the button that fetches a fix must not die with what it fixes.
    -->
    <script type="module" src="js/update.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
